<head>
<meta charset="utf-8" />
<script type="importmap">

</script>
</head>
<body style="margin:0">

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/RoundedBoxGeometry.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setClearColor(0x000000, 0);

const PALETTE = {
  orangeDeep: 0xf26a1b, orange: 0xf98b3d, orangeLight: 0xffb877, orangePale: 0xffe3d1,
  checkPale: 0xffe7d7, gray: 0xc9ced8, white: 0xfffdfb,
  leaf: 0x6fbf8b, leafLight: 0x9ddab5, leafPale: 0xc6ebd3,
  blue: 0x6f9df0, blueLight: 0xa9c9f8, bluePale: 0xd2e2fd,
  purple: 0x9a8bf0, purpleLight: 0xbcb1fa, purplePale: 0xd8d3fd,
  green: 0x4ea370, greenLight: 0x74c18c, greenPale: 0xc6ebd3
};

const mat = (color, rough = 0.62) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: 0 });

function baseScene(w, h, camY = 0.55, camZ = 7.4) {
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(26, w / h, 0.1, 60);
  cam.position.set(0, camY, camZ);
  cam.lookAt(0, 0, 0);
  scene.add(new THREE.HemisphereLight(0xfff8f0, 0xffd9b8, 1.15));
  const key = new THREE.DirectionalLight(0xffffff, 1.5);
  key.position.set(3.2, 5, 4.5);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffe4cc, 0.55);
  fill.position.set(-4, 1.5, 3);
  scene.add(fill);
  return { scene, cam };
}

function contactShadow(scene, y, w, h, opacity = 0.3) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 8, 128, 128, 128);
  grd.addColorStop(0, 'rgba(150, 92, 42, 0.6)');
  grd.addColorStop(1, 'rgba(150, 92, 42, 0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, opacity, depthWrite: false })
  );
  m.rotation.x = -Math.PI / 2;
  m.position.y = y;
  scene.add(m);
}

function leafMesh(color, sx = 1, sy = 1) {
  const g = new THREE.SphereGeometry(0.5, 28, 18);
  g.scale(1.7 * sx, 0.5 * sy, 0.22);
  return new THREE.Mesh(g, mat(color, 0.7));
}

function checkDisc(scene, x, y, z, r = 0.37, discColor = PALETTE.checkPale) {
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.06, 48), mat(discColor, 0.8));
  disc.rotation.x = Math.PI / 2;
  disc.position.set(x, y, z);
  scene.add(disc);
  const path = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.16, 0.0, 0),
    new THREE.Vector3(-0.04, -0.13, 0),
    new THREE.Vector3(0.2, 0.14, 0)
  ]);
  const stroke = new THREE.Mesh(
    new THREE.TubeGeometry(path, 24, 0.052, 12, false),
    mat(PALETTE.orangeDeep, 0.55)
  );
  stroke.position.set(x, y, z + 0.05);
  scene.add(stroke);
}

function giftBox(scene, x, y, z, s = 1) {
  const body = new THREE.Mesh(new RoundedBoxGeometry(0.52 * s, 0.36 * s, 0.32 * s, 4, 0.07), mat(PALETTE.orange, 0.68));
  body.position.set(x, y, z);
  scene.add(body);
  const lid = new THREE.Mesh(new RoundedBoxGeometry(0.6 * s, 0.14 * s, 0.38 * s, 4, 0.06), mat(0xf7a05e, 0.68));
  lid.position.set(x, y + 0.22 * s, z);
  scene.add(lid);
  const knot = new THREE.Mesh(new RoundedBoxGeometry(0.1 * s, 0.12 * s, 0.12 * s, 3, 0.04), mat(PALETTE.orangePale, 0.7));
  knot.position.set(x, y + 0.32 * s, z);
  scene.add(knot);
}

/* ── 场景 1:统计条日历 ── */
function sceneCalendar() {
  const { scene, cam } = baseScene(500, 292, 0.42, 7.2);
  const g = new THREE.Group();
  const body = new THREE.Mesh(new RoundedBoxGeometry(2.0, 1.36, 0.34, 5, 0.12), mat(PALETTE.white, 0.55));
  body.position.y = 0.1;
  g.add(body);
  const band = new THREE.Mesh(new RoundedBoxGeometry(2.02, 0.46, 0.36, 5, 0.12), mat(PALETTE.orange, 0.5));
  band.position.y = 0.58;
  g.add(band);
  for (const rx of [-0.42, 0.42]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.045, 14, 28), mat(PALETTE.gray, 0.5));
    ring.position.set(rx, 0.88, 0);
    g.add(ring);
  }
  checkDisc(g, 0.04, 0.02, 0.18, 0.4, 0xffd8ba);
  for (const [dx, dy] of [[-0.72, -0.4], [0.78, -0.4]]) {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 12), mat(0xffd9bd, 0.8));
    dot.position.set(dx, dy, 0.18);
    g.add(dot);
  }
  g.rotation.z = -0.09;
  g.position.set(0.1, 0.05, 0);
  scene.add(g);
  giftBox(scene, -1.32, -0.66, 0, 1.2);
  const l1 = leafMesh(PALETTE.leafLight, 0.85, 0.85); l1.position.set(1.16, -0.78, 0); l1.rotation.z = -0.55; scene.add(l1);
  const l2 = leafMesh(PALETTE.leaf, 0.72, 0.8); l2.position.set(1.4, -0.58, -0.1); l2.rotation.z = -1.05; scene.add(l2);
  const l3 = leafMesh(PALETTE.leafPale, 0.6, 0.7); l3.position.set(1.02, -0.9, 0.05); l3.rotation.z = -0.25; scene.add(l3);
  contactShadow(scene, -1.02, 4.4, 1.1, 0.32);
  return { scene, cam };
}

/* ── 场景 2-5:单元卡 ── */
function sceneUnit(variant) {
  const { scene, cam } = baseScene(300, 244, 0.5, 7.6);
  const g = new THREE.Group();
  const P = {
    1: [PALETTE.orangeLight, PALETTE.orangePale, PALETTE.orangeDeep, PALETTE.orange],
    2: [PALETTE.blueLight, PALETTE.bluePale, 0x5c86d8, PALETTE.blue],
    3: [PALETTE.purpleLight, PALETTE.purplePale, 0x7d6ce2, PALETTE.purple],
    4: [PALETTE.greenLight, PALETTE.greenPale, 0x43975f, PALETTE.green]
  }[variant];

  if (variant === 1) {
    const b1 = new THREE.Mesh(new RoundedBoxGeometry(1.7, 0.72, 1.0, 4, 0.12), mat(P[0], 0.62));
    b1.position.set(0, -0.42, 0); b1.rotation.y = 0.12; g.add(b1);
    const b2 = new THREE.Mesh(new RoundedBoxGeometry(1.14, 0.6, 0.78, 4, 0.11), mat(P[0], 0.62));
    b2.position.set(-0.12, 0.12, 0); b2.rotation.y = -0.1; g.add(b2);
    const b3 = new THREE.Mesh(new RoundedBoxGeometry(0.68, 0.5, 0.56, 4, 0.1), mat(P[0], 0.62));
    b3.position.set(0.05, 0.6, 0.05); b3.rotation.y = 0.2; g.add(b3);
  } else if (variant === 2) {
    const b1 = new THREE.Mesh(new RoundedBoxGeometry(1.2, 1.14, 1.05, 4, 0.13), mat(P[0], 0.62));
    b1.position.set(0, -0.12, 0); b1.rotation.y = 0.16; g.add(b1);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.1, 18, 14), mat(P[1], 0.7));
    dot.position.set(0.85, 0.62, -0.2); g.add(dot);
    const dot2 = new THREE.Mesh(new THREE.SphereGeometry(0.07, 18, 14), mat(P[1], 0.7));
    dot2.position.set(-0.95, 0.4, -0.3); g.add(dot2);
  } else if (variant === 3) {
    const book = new THREE.Mesh(new RoundedBoxGeometry(0.78, 1.5, 0.92, 4, 0.11), mat(P[0], 0.62));
    book.position.set(-0.1, -0.05, 0); book.rotation.z = -0.1; book.rotation.y = 0.14; g.add(book);
    const spine = new THREE.Mesh(new RoundedBoxGeometry(0.12, 1.2, 0.8, 3, 0.05), mat(PALETTE.white, 0.6));
    spine.position.set(-0.42, -0.08, 0.08); spine.rotation.z = -0.1; spine.rotation.y = 0.14; g.add(spine);
    const cube = new THREE.Mesh(new RoundedBoxGeometry(0.52, 0.42, 0.42, 4, 0.09), mat(P[1], 0.62));
    cube.position.set(0.68, -0.58, 0.1); cube.rotation.y = 0.3; g.add(cube);
  } else {
    const b1 = new THREE.Mesh(new RoundedBoxGeometry(1.1, 0.86, 0.9, 4, 0.12), mat(P[0], 0.62));
    b1.position.set(-0.25, -0.35, 0); b1.rotation.y = 0.14; g.add(b1);
    const trunk = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.58, 8, 18), mat(P[2], 0.66));
    trunk.position.set(0.74, 0.06, 0); g.add(trunk);
    const top = new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 16), mat(P[2], 0.66));
    top.position.set(0.74, 0.4, 0); g.add(top);
    const arm1 = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.26, 8, 16), mat(P[2], 0.66));
    arm1.position.set(0.5, 0.22, 0); arm1.rotation.z = Math.PI / 2; g.add(arm1);
    const armUp1 = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 0.22, 8, 16), mat(P[2], 0.66));
    armUp1.position.set(0.5, 0.4, 0); g.add(armUp1);
    const arm2 = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.22, 8, 16), mat(P[2], 0.66));
    arm2.position.set(0.98, 0.1, 0); arm2.rotation.z = Math.PI / 2; g.add(arm2);
    const armUp2 = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.18, 8, 16), mat(P[2], 0.66));
    armUp2.position.set(0.98, 0.26, 0); g.add(armUp2);
  }
  g.position.set(-0.12, 0, 0);
  scene.add(g);
  contactShadow(scene, -0.98, 3.2, 0.9, 0.3);
  return { scene, cam };
}

/* ── 场景 6:Hero 横幅漂浮物 ── */
function sceneHero() {
  const { scene, cam } = baseScene(1600, 448, 0.7, 10.5);
  cam.fov = 24; cam.updateProjectionMatrix();
  // 右侧元素群
  const stack = new THREE.Group();
  const s1 = new THREE.Mesh(new RoundedBoxGeometry(1.5, 0.66, 0.95, 4, 0.12), mat(PALETTE.orangeLight, 0.62));
  const s2 = new THREE.Mesh(new RoundedBoxGeometry(1.05, 0.56, 0.8, 4, 0.11), mat(PALETTE.orangeLight, 0.62));
  const s3 = new THREE.Mesh(new RoundedBoxGeometry(0.66, 0.46, 0.6, 4, 0.1), mat(PALETTE.orange, 0.62));
  s2.position.set(-0.06, 0.58, 0); s2.rotation.y = -0.16;
  s3.position.set(0.04, 1.1, 0.02); s3.rotation.y = 0.2;
  stack.add(s1, s2, s3);
  stack.position.set(2.6, -0.5, 0); stack.rotation.y = 0.24;
  scene.add(stack);
  const cube = new THREE.Mesh(new RoundedBoxGeometry(0.9, 0.9, 0.9, 4, 0.13), mat(PALETTE.blueLight, 0.62));
  cube.position.set(4.3, 0.55, -0.6); cube.rotation.set(0.4, 0.6, 0); scene.add(cube);
  const book = new THREE.Mesh(new RoundedBoxGeometry(0.6, 1.3, 0.72, 4, 0.1), mat(PALETTE.purpleLight, 0.62));
  book.position.set(5.7, -0.35, -0.2); book.rotation.z = -0.16; book.rotation.y = 0.4; scene.add(book);
  const sph = new THREE.Mesh(new THREE.SphereGeometry(0.34, 28, 20), mat(PALETTE.orangePale, 0.55));
  sph.position.set(3.5, 1.35, -0.4); scene.add(sph);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.075, 14, 30), mat(PALETTE.orangeLight, 0.6));
  ring.position.set(1.55, 1.15, -0.5); ring.rotation.set(0.7, 0.4, 0); scene.add(ring);
  const l1 = leafMesh(PALETTE.leafLight); l1.position.set(0.65, 0.75, -0.3); l1.rotation.z = -0.5; scene.add(l1);
  const l2 = leafMesh(PALETTE.leaf, 0.8, 0.9); l2.position.set(0.25, 0.35, -0.1); l2.rotation.z = -1.0; scene.add(l2);
  const l3 = leafMesh(PALETTE.greenLight, 1.1, 1); l3.position.set(5.05, 0.9, 0.1); l3.rotation.z = 0.5; scene.add(l3);
  const mini = new THREE.Mesh(new RoundedBoxGeometry(0.8, 0.6, 0.4, 4, 0.1), mat(PALETTE.white, 0.55));
  mini.position.set(0.15, -0.6, 0.2); mini.rotation.z = 0.12; scene.add(mini);
  const band = new THREE.Mesh(new RoundedBoxGeometry(0.82, 0.2, 0.42, 4, 0.09), mat(PALETTE.orange, 0.5));
  band.position.set(0.15, -0.32, 0.2); band.rotation.z = 0.12; scene.add(band);
  // 底部柔和接触阴影
  contactShadow(scene, -1.25, 7.5, 1.3, 0.22);
  // 暖色背光晕(平面渐变)
  const c = document.createElement('canvas');
  c.width = 512; c.height = 144;
  const g2 = c.getContext('2d');
  const grd = g2.createRadialGradient(400, 72, 30, 400, 72, 250);
  grd.addColorStop(0, 'rgba(255, 190, 120, 0.5)');
  grd.addColorStop(0.7, 'rgba(255, 190, 120, 0.14)');
  grd.addColorStop(1, 'rgba(255, 190, 120, 0)');
  g2.fillStyle = grd; g2.fillRect(0, 0, 512, 144);
  const glow = new THREE.Mesh(
    new THREE.PlaneGeometry(9.5, 2.7),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false })
  );
  glow.position.set(2.6, 0.1, -1.6);
  scene.add(glow);
  return { scene, cam };
}

const SCENES = {
  calendar: { fn: sceneCalendar, w: 500, h: 292 },
  unit1: { fn: () => sceneUnit(1), w: 300, h: 244 },
  unit2: { fn: () => sceneUnit(2), w: 300, h: 244 },
  unit3: { fn: () => sceneUnit(3), w: 300, h: 244 },
  unit4: { fn: () => sceneUnit(4), w: 300, h: 244 },
  hero: { fn: sceneHero, w: 1600, h: 448 }
};

window.__renderAll = async () => {
  const out = [];
  for (const [name, cfg] of Object.entries(SCENES)) {
    const { scene, cam } = cfg.fn();
    renderer.setSize(cfg.w, cfg.h);
    renderer.setPixelRatio(1);
    renderer.render(scene, cam);
    out.push({ name, url: renderer.domElement.toDataURL('image/png') });
    // 释放
    scene.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (o.material.map) o.material.map.dispose();
        o.material.dispose();
      }
    });
  }
  window.__cache = out;
  return out.length;
};
window.__getResult = (name) => {
  const r = window.__cache?.find((i) => i.name === name);
  return r ? r.url : null;
};
window.__ready = true;
</script>
