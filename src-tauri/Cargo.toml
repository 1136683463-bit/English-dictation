[package]
name = "personal-vocab-desktop"
version = "0.1.0"
description = "Personal vocabulary desktop app"
authors = ["liujun"]
edition = "2021"

[lib]
name = "personal_vocab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
