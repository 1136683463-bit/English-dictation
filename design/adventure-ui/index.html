<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>冒险学习 · 界面 1:1 还原</title>
<style>
  /* ==========================================================
     Design Tokens — 冒险学习界面
     ========================================================== */
  :root {
    /* Color —— 沿用项目现有配色体系（src/styles.css :root 令牌） */
    --c-bg: #f4f6f8;             /* --bg */
    --c-surface: #ffffff;        /* --surface */
    --c-border: #e8edf1;         /* --line */
    --c-border-strong: #d7dfe6;  /* --line-strong */
    --c-text: #1f2b3a;           /* --ink */
    --c-text-2: #5f6b7a;         /* --muted */
    --c-text-3: #98a4b3;         /* 弱文字（muted 的浅一档） */
    --c-primary: #f26a1b;        /* --accent */
    --c-primary-deep: #d95a12;   /* --accent-strong */
    --c-primary-soft: #fff1e8;   /* --accent-soft */
    --c-primary-softer: #fff6ef;

    /* Template icon tones —— 映射项目语义色 */
    --tone-blue-bg: #eef3ff;   --tone-blue-fg: #3b6ef5;   /* --blue-soft / --blue */
    --tone-red-bg: #fdeeee;    --tone-red-fg: #d64545;    /* --danger-soft / --danger */
    --tone-teal-bg: #e9f8ef;   --tone-teal-fg: #2f9e63;   /* --green-soft / green 加深保证图标可读 */
    --tone-amber-bg: #fdf3d8;  --tone-amber-fg: #d99e00;  /* --amber-soft / amber 加深保证图标可读 */

    /* Radius */
    --r-xl: 20px;
    --r-lg: 14px;
    --r-md: 10px;

    /* Shadow —— 与项目 shadow-sm / focus 体系一致 */
    --shadow-card: 0 1px 2px rgba(31, 43, 58, 0.04), 0 4px 14px rgba(31, 43, 58, 0.06);
    --shadow-pop: 0 6px 18px rgba(242, 106, 27, 0.22);

    /* Type —— 与项目字体栈一致 */
    --font: Inter, "HarmonyOS Sans SC", "PingFang SC", "Hiragino Sans GB",
            "Microsoft YaHei", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-script: "Snell Roundhand", "Savoye LET", "Segoe Script", "Bradley Hand", cursive;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    background: var(--c-bg);
    color: var(--c-text);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  svg { display: block; }

  .app-shell { display: flex; min-height: 100dvh; }

  /* ==========================================================
     Sidebar — 76px 图标导航
     ========================================================== */
  .sidebar {
    width: 76px;
    flex: 0 0 76px;
    background: var(--c-surface);
    border-right: 1px solid var(--c-border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 0 16px;
    position: sticky;
    top: 0;
    height: 100dvh;
  }
  .brand-mark {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--c-primary);
    display: grid; place-items: center;
    color: #fff;
    box-shadow: 0 4px 12px rgba(242, 106, 27, 0.22);
    margin-bottom: 18px;
  }
  .side-nav { display: flex; flex-direction: column; gap: 6px; width: 100%; align-items: center; flex: 1; }
  .side-item {
    width: 58px;
    padding: 7px 0 6px;
    border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--c-text-3);
    font-size: 11px;
    transition: all 160ms ease;
    position: relative;
  }
  .side-item:hover { color: var(--c-text-2); background: #f1f4f7; }
  .side-item.active {
    color: var(--c-primary);
    background: var(--c-primary-soft);
    font-weight: 600;
  }
  .side-footer {
    margin-top: auto;
    width: 40px; height: 40px;
    border-radius: 12px;
    display: grid; place-items: center;
    color: var(--c-text-3);
    transition: all 160ms ease;
  }
  .side-footer:hover { color: var(--c-text-2); background: #f1f4f7; }

  /* ==========================================================
     Main
     ========================================================== */
  .main { flex: 1; min-width: 0; padding: 22px 28px 40px; max-width: 1180px; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    border-radius: var(--r-xl);
    overflow: hidden;
    height: 150px;
    display: flex; align-items: center;
    background: #cfd8dd;
  }
  .hero-img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 40%;
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.55) 34%, rgba(255,255,255,0) 62%);
  }
  .hero-content { position: relative; z-index: 1; padding: 0 30px; }
  .hero-eyebrow {
    color: var(--c-primary);
    font-size: 11px; font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 6px;
  }
  .hero-title { font-size: 32px; font-weight: 800; letter-spacing: 0.5px; color: var(--c-text); }
  .hero-sub { margin-top: 7px; font-size: 13.5px; color: var(--c-text-2); }
  .hero-script {
    position: absolute; z-index: 1;
    top: 18px; right: 26px;
    font-family: var(--font-script);
    font-size: 19px;
    color: #fff;
    text-align: right;
    line-height: 1.35;
    text-shadow: 0 1px 8px rgba(31, 43, 58, 0.35);
    transform: rotate(-2deg);
  }

  /* ---------- 继续阅读卡 ---------- */
  .resume-card {
    margin-top: 16px;
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-card);
    padding: 13px 16px;
    display: flex; align-items: center; gap: 14px;
    transition: box-shadow 200ms ease, transform 200ms ease;
  }
  .resume-card:hover { box-shadow: 0 6px 22px rgba(31, 43, 58, 0.09); transform: translateY(-1px); }
  .cover {
    position: relative;
    width: 54px; height: 54px;
    border-radius: 12px;
    overflow: hidden;
    flex: 0 0 54px;
  }
  .cover svg { width: 100%; height: 100%; }
  .cover-badge {
    position: absolute; left: 0; bottom: 0;
    background: var(--c-primary);
    color: #fff;
    font-size: 9px; font-weight: 700;
    padding: 1.5px 6px;
    border-top-right-radius: 8px;
  }
  .resume-info { flex: 1; min-width: 0; }
  .resume-title { font-size: 16.5px; font-weight: 700; }
  .progress {
    margin-top: 8px;
    width: 210px; max-width: 46%;
    height: 5px;
    border-radius: 99px;
    background: #e8edf1;
    overflow: hidden;
  }
  .progress > i {
    display: block; height: 100%;
    width: 46%;
    border-radius: 99px;
    background: var(--c-primary);
  }
  .resume-meta { margin-top: 7px; font-size: 12px; color: var(--c-text-3); }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--c-primary);
    color: #fff;
    font-size: 13.5px; font-weight: 600;
    padding: 10px 18px;
    border-radius: 99px;
    box-shadow: var(--shadow-pop);
    transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
  }
  .btn-primary:hover { background: var(--c-primary-deep); box-shadow: 0 4px 14px rgba(242, 106, 27, 0.28); }
  .btn-primary:active { transform: scale(0.97); }

  /* ---------- 区块标题 ---------- */
  .section-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin: 26px 2px 12px;
  }
  .eyebrow {
    color: var(--c-primary);
    font-size: 10.5px; font-weight: 800;
    letter-spacing: 2.5px;
    margin-bottom: 5px;
  }
  .section-title { font-size: 21px; font-weight: 800; letter-spacing: 0.3px; }
  .section-actions { display: flex; gap: 8px; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--c-surface);
    border: 1px solid var(--c-border-strong);
    color: var(--c-text-2);
    font-size: 12.5px; font-weight: 500;
    padding: 7px 13px;
    border-radius: 99px;
    transition: all 160ms ease;
  }
  .btn-ghost:hover { border-color: #c9d3dc; color: var(--c-text); background: #fbfcfd; }
  .btn-ghost:active { transform: scale(0.97); }

  /* ---------- 新冒险区（卡片直接置于页面背景上） ---------- */
  .route-section { margin-top: 0; }
  .route-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  .route-card {
    position: relative;
    text-align: left;
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--r-lg);
    padding: 16px 30px 16px 16px;
    display: flex; flex-direction: column; gap: 9px;
    transition: all 180ms ease;
  }
  .route-card:hover {
    border-color: #d7dfe6;
    box-shadow: 0 8px 20px rgba(31, 43, 58, 0.08);
    transform: translateY(-2px);
  }
  .route-card.selected {
    border: 1.5px solid var(--c-primary);
    background: var(--c-primary-softer);
    box-shadow: 0 6px 18px rgba(242, 106, 27, 0.12);
  }
  .tone-icon {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: grid; place-items: center;
  }
  .tone-blue  { background: var(--tone-blue-bg);  color: var(--tone-blue-fg); }
  .tone-red   { background: var(--tone-red-bg);   color: var(--tone-red-fg); }
  .tone-teal  { background: var(--tone-teal-bg);  color: var(--tone-teal-fg); }
  .tone-amber { background: var(--tone-amber-bg); color: var(--tone-amber-fg); }
  .tone-orange{
    background: var(--c-primary);
    color: #fff;
    box-shadow: 0 3px 8px rgba(242, 106, 27, 0.25);
  }
  .route-name { font-size: 14.5px; font-weight: 700; }
  .route-card.selected .route-name { color: var(--c-text); }
  .route-desc { font-size: 11.5px; line-height: 1.55; color: var(--c-text-3); }
  .route-card.selected .route-desc { color: #c76f2e; }
  .route-chevron {
    position: absolute; right: 11px; top: 50%;
    transform: translateY(-50%);
    color: #c3ccd6;
  }
  .route-card.selected .route-chevron { color: var(--c-primary); }

  /* ---------- 表单行（直接置于页面背景上） ---------- */
  .form-rows { margin-top: 18px; display: flex; flex-direction: column; gap: 13px; }
  .form-row { display: flex; align-items: center; gap: 12px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--c-text-2); flex: 0 0 auto; }
  .chip-group { display: flex; gap: 8px; }
  .chip {
    min-width: 44px;
    padding: 5.5px 12px;
    border-radius: 99px;
    border: 1px solid var(--c-border-strong);
    background: var(--c-surface);
    color: var(--c-text-2);
    font-size: 12px; font-weight: 600;
    text-align: center;
    transition: all 150ms ease;
  }
  .chip:hover { border-color: #c9d3dc; }
  .chip.active {
    background: var(--c-primary);
    border-color: var(--c-primary);
    color: #fff;
    box-shadow: 0 3px 10px rgba(242, 106, 27, 0.25);
  }
  .hint-input-wrap {
    flex: 1;
    position: relative;
    display: flex; align-items: center;
  }
  .hint-input {
    width: 100%;
    padding: 9px 40px 9px 14px;
    border-radius: var(--r-md);
    border: 1px solid var(--c-border-strong);
    background: #ffffff;
    font-size: 13px;
    font-family: inherit;
    color: var(--c-text);
    outline: none;
    transition: all 160ms ease;
  }
  .hint-input::placeholder { color: var(--c-text-3); }
  .hint-input:focus {
    border-color: var(--c-primary);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(242, 106, 27, 0.12);
  }
  .input-spark {
    position: absolute; right: 13px;
    color: var(--c-primary);
    pointer-events: none;
  }
  .idea-chip {
    padding: 5.5px 12px;
    border-radius: 99px;
    background: #f1f4f7;
    color: var(--c-text-2);
    font-size: 12px;
    transition: all 150ms ease;
  }
  .idea-chip:hover { background: #e9eef3; color: var(--c-text); }
  .idea-label { font-size: 13px; color: var(--c-text-3); flex: 0 0 auto; }

  .panel-footer {
    margin-top: 18px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .auto-save-hint {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--c-text-3);
  }
  .auto-save-hint svg { color: #c3ccd6; }

  /* ---------- 我的路线 ---------- */
  .saved-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .saved-card {
    display: flex; align-items: center; gap: 11px;
    text-align: left;
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--r-lg);
    padding: 11px 12px;
    transition: all 180ms ease;
    min-width: 0;
  }
  .saved-card:hover {
    border-color: #d7dfe6;
    box-shadow: 0 8px 20px rgba(31, 43, 58, 0.08);
    transform: translateY(-2px);
  }
  .saved-thumb {
    width: 46px; height: 46px;
    border-radius: 10px;
    overflow: hidden;
    flex: 0 0 46px;
  }
  .saved-thumb svg { width: 100%; height: 100%; }
  .saved-body { flex: 1; min-width: 0; }
  .saved-top { display: flex; align-items: center; gap: 7px; }
  .saved-title {
    flex: 1; min-width: 0;
    font-size: 13.5px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .level-tag {
    flex: 0 0 auto;
    font-size: 10px; font-weight: 700;
    color: var(--c-text-2);
    background: #eef2f6;
    border-radius: 6px;
    padding: 2px 6px;
  }
  .bookmark-btn { flex: 0 0 auto; color: #c3ccd6; transition: color 150ms ease; }
  .bookmark-btn:hover, .bookmark-btn.on { color: var(--c-primary); }
  .saved-meta {
    margin-top: 6px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11.5px; color: var(--c-text-3);
  }
  .saved-chevron { flex: 0 0 auto; color: #c3ccd6; }

  /* ---------- 响应式 ---------- */
  @media (max-width: 1080px) {
    .route-grid { grid-template-columns: repeat(3, 1fr); }
    .saved-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    .route-grid { grid-template-columns: repeat(2, 1fr); }
    .saved-grid { grid-template-columns: 1fr; }
    .hero-script { display: none; }
    .form-row { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="app-shell">

  <!-- ================= 侧边栏 ================= -->
  <aside class="sidebar">
    <div class="brand-mark" aria-label="应用Logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <line x1="4" y1="10" x2="4" y2="14"/><line x1="8" y1="7" x2="8" y2="17"/>
        <line x1="12" y1="4" x2="12" y2="20"/><line x1="16" y1="8" x2="16" y2="16"/>

      </svg>
    </div>
    <nav class="side-nav" aria-label="主导航">
      <button class="side-item active">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20Z"/><path d="M9.5 21.5v-7h5v7"/></svg>
        <span>首页</span>
      </button>
      <button class="side-item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M15.9 8.1 14 14l-5.9 1.9L9.9 10Z"/></svg>
        <span>探索</span>
      </button>
      <button class="side-item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h5.5a3.5 3.5 0 0 1 3.5 3.5V21a2.5 2.5 0 0 0-2.5-2.5h-6.5Z"/><path d="M21.5 4H16a3.5 3.5 0 0 0-3.5 3.5V21a2.5 2.5 0 0 1 2.5-2.5h6.5Z"/></svg>
        <span>学习</span>
      </button>
      <button class="side-item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5 2.5 7v12.5L9 17l6 2.5 6.5-2.5V4.5L15 7Z"/><path d="M9 4.5V17M15 7v12.5"/></svg>
        <span>路线</span>
      </button>
      <button class="side-item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 21 12 16.5 5.5 21V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2Z"/></svg>
        <span>收藏</span>
      </button>
      <button class="side-item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/><path d="M16 5.2a3.5 3.5 0 0 1 0 5.9"/><path d="M17.8 14.3a6.2 6.2 0 0 1 3.5 5.7"/></svg>
        <span>社区</span>
      </button>
      <button class="side-item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.2 9.2a2.9 2.9 0 0 1 5.6 1c0 1.9-2.8 2.4-2.8 3.8"/><circle cx="12" cy="17.3" r="0.4" fill="currentColor"/></svg>
        <span>帮助</span>
      </button>
      <button class="side-item">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.98 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.98a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09c0 .68.4 1.29 1.03 1.56a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.27.62.88 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51.97Z"/></svg>
        <span>设置</span>
      </button>
    </nav>
    <button class="side-footer" aria-label="下载与导出">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
    </button>
  </aside>

  <!-- ================= 主内容 ================= -->
  <main class="main">

    <!-- 英雄横幅 -->
    <section class="hero">
      <img class="hero-img" src="assets/adventure-hero.jpg" alt="山间远眺的旅人" />
      <div class="hero-content">
        <div class="hero-eyebrow">ADVENTURE</div>
        <h1 class="hero-title">冒险学习</h1>
        <p class="hero-sub">读一段故事，做一次选择，把真正想记住的词收进词库。</p>
      </div>
      <div class="hero-script" aria-hidden="true">Better<br/>You<br/>Every Day</div>
    </section>

    <!-- 继续阅读 -->
    <section class="resume-card" aria-label="继续阅读">
      <div class="cover">
        <svg viewBox="0 0 54 54" aria-hidden="true">
          <rect width="54" height="54" fill="#2e3454"/>

<script>
  // 轻交互：路线卡片单选 / 难度单选 / 书签切换 / 灵感回填
  document.querySelectorAll("[data-route]").forEach((card) => {
    card.addEventListener("click", () => {
      document.querySelectorAll("[data-route]").forEach((c) => c.classList.remove("selected"));
      card.classList.add("selected");
    });
  });
  document.querySelectorAll("#level-group .chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      document.querySelectorAll("#level-group .chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
    });
  });
  document.querySelectorAll(".bookmark-btn").forEach((btn) => {
    btn.addEventListener("click", (e) => { e.stopPropagation(); btn.classList.toggle("on"); });
  });
  document.querySelectorAll(".idea-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      const input = document.getElementById("hint-input");
      input.value = chip.textContent.trim();
      input.focus();
    });
  });
</script>
